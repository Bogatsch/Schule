<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#073b4c">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'">
    <title>Pritschen seitlich | Sportkamera</title>
    <meta name="description" content="Volleyball-Leitbild zum seitlichen Pritschen ansehen.">
    <link rel="manifest" href="../../../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../../../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="../../../../icons/favicon-64.png">
    <link rel="stylesheet" href="../../../../styles.css?v=28">
    <link rel="stylesheet" href="../../styles.css">
    <script type="module" src="../angriffsschlag/app.js?v=28"></script>
  </head>
  <body data-view="guides">
    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>

    <div class="app-shell">
      <header class="topbar" aria-label="App-Kopfzeile">
        <a class="brand brand-link" href="../../../../index.html" aria-label="Zur Sportkamera">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>
            <strong>Sportkamera</strong>
            <small>Direktes Bewegungsfeedback</small>
          </span>
        </a>
      </header>

      <main id="main-content" tabindex="-1">
        <section class="view guides-view" aria-labelledby="video-title">
          <a class="text-button guides-back video-back" href="../index.html">
            <span aria-hidden="true">←</span> Zurück
          </a>

          <div class="guides-panel video-page-panel">
            <div class="step-label">Volleyball</div>
            <h1 id="video-title">Pritschen seitlich</h1>

            <div class="guide-video-stage">
              <video id="guide-video" class="guide-video" playsinline muted preload="metadata" aria-label="Volleyball-Leitbild zum seitlichen Pritschen" controlslist="nodownload noplaybackrate noremoteplayback" disableremoteplayback disablepictureinpicture>
                <source src="../../../../Videos/Spielsportarten/Volleyball/Pritschen/Pritschen%20seitlich.mp4" type="video/mp4">
                Dein Browser kann dieses Video nicht abspielen.
              </video>
            </div>

            <div class="playback-controls guide-playback-controls" aria-label="Videowiedergabe">
              <button id="guide-play-button" class="play-button" type="button" aria-label="Video starten">
                <span aria-hidden="true">▶</span>
              </button>
              <div class="timeline-wrap">
                <label class="visually-hidden" for="guide-timeline">Wiedergabeposition</label>
                <input id="guide-timeline" type="range" min="0" max="1000" value="0" step="1">
                <output id="guide-playback-time" for="guide-timeline">0:00 / 0:00</output>
              </div>
              <div class="guide-player-tools">
                <fieldset class="speed-control">
                  <legend>Tempo</legend>
                  <div role="group" aria-label="Wiedergabegeschwindigkeit">
                    <button type="button" data-guide-speed="0.25" aria-pressed="false">0,25×</button>
                    <button type="button" data-guide-speed="0.5" aria-pressed="false">0,5×</button>
                    <button type="button" data-guide-speed="1" aria-pressed="true">1×</button>
                  </div>
                </fieldset>
                <button id="guide-annotation-button" class="download-icon-button" type="button" aria-label="Aktuellen Frame des Leitbilds annotieren" aria-haspopup="dialog" aria-controls="annotation-dialog" title="Frame annotieren">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20zM13.5 8.5l3 3"></path>
                  </svg>
                </button>
              </div>
            </div>
            <p id="guide-video-status" class="preview-status" role="status" aria-live="polite"></p>

            <dialog id="annotation-dialog" class="annotation-dialog" aria-labelledby="annotation-dialog-title">
              <div class="annotation-dialog-shell">
                <header class="annotation-dialog-header">
                  <div>
                    <p class="eyebrow">Frame annotieren</p>
                    <h2 id="annotation-dialog-title">Videoframe annotieren</h2>
                  </div>
                  <button id="annotation-close" class="comparison-close" type="button" aria-label="Annotation schließen">×</button>
                </header>
                <div class="annotation-toolbar">
                  <div class="annotation-tool-group" role="group" aria-label="Zeichenwerkzeug">
                    <button type="button" data-annotation-tool="pen" aria-pressed="true">
                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20zM13.5 8.5l3 3"></path></svg>
                      <span>Stift</span>
                    </button>
                    <button type="button" data-annotation-tool="eraser" aria-pressed="false">
                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 18h11M4.8 13.2l7.7-7.7a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 18H9l-4.2-4.8z"></path></svg>
                      <span>Radierer</span>
                    </button>
                  </div>
                  <fieldset class="annotation-colors">
                    <legend>Farbe</legend>
                    <div role="group" aria-label="Stiftfarbe">
                      <button type="button" data-annotation-color="#ef4f3f" aria-label="Rot" aria-pressed="true"></button>
                      <button type="button" data-annotation-color="#ffd166" aria-label="Gelb" aria-pressed="false"></button>
                      <button type="button" data-annotation-color="#118a8b" aria-label="Türkis" aria-pressed="false"></button>
                      <button type="button" data-annotation-color="#ffffff" aria-label="Weiß" aria-pressed="false"></button>
                      <button type="button" data-annotation-color="#071d24" aria-label="Dunkelblau" aria-pressed="false"></button>
                    </div>
                  </fieldset>
                </div>
                <div id="annotation-canvas-stage" class="annotation-canvas-stage">
                  <canvas id="annotation-frame-canvas" aria-hidden="true"></canvas>
                  <canvas id="annotation-drawing-canvas" aria-label="Zeichenfläche für den aktuellen Videoframe"></canvas>
                </div>
              </div>
            </dialog>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
